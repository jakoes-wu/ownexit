name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          for f in direct/*.sh direct/subctl chain/*.sh scripts/*.sh; do bash -n "$f"; done
      - name: ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S warning direct/*.sh direct/subctl chain/*.sh scripts/*.sh
      - name: Privacy scan
        run: scripts/check_public.sh
      - name: Interface freeze
        # 2.x 冻结的参数、子命令、status 取值、配置 / 状态键、订阅文件名必须与 docs/reference/ 一致（docs/reference/compatibility.md）。
        run: scripts/check_interface.sh
      - name: Bilingual docs
        # 中英成对文档都存在、顶部互链，英文页不链回中文页、锚点有效（scripts/check_i18n.sh）。
        run: scripts/check_i18n.sh
      - name: Bilingual script output
        # 运行时脚本里每条中文提示都写成 L "中文" "English"，两种语言的占位符个数一致（scripts/check_ui_lang.sh）。
        run: scripts/check_ui_lang.sh
      - name: sing-box constants
        # 直连与链式各写了一份 sing-box 版本与官方包摘要，必须逐字一致，防止升级时只改一边。
        run: |
          pattern='^readonly (SING_BOX_VERSION|ARCHIVE_SHA256_LINUX_(AMD64|ARM64)|BINARY_SHA256_LINUX_(AMD64|ARM64))='
          diff <(grep -E "$pattern" chain/setup_chain.sh | sort) <(grep -E "$pattern" direct/setup_direct.sh | sort)
          [ "$(grep -cE "$pattern" direct/setup_direct.sh)" -eq 5 ]
      - name: README links
        # README.md 同时是 PyPI 项目页的正文，PyPI 上相对链接会 404，所以只允许完整 URL 和页内锚点。
        run: |
          if grep -noE '\]\([^)]+\)' README.md | grep -vE '\]\((https?://|#)'; then
            echo 'README.md has relative links; use https://github.com/jakoes-wu/ownexit/blob/main/... instead'; exit 1
          fi
      - name: Help output
        # 每个入口的 --help 都要退出 0，未知参数都要非 0 退出。
        run: |
          for f in direct/setup_direct.sh direct/connect_to.sh direct/sync_to_vps.sh direct/direct_remote.sh direct/doctor.sh \
                   chain/setup_chain.sh chain/multi_chain_client.sh scripts/check_public.sh scripts/check_interface.sh scripts/check_i18n.sh scripts/check_ui_lang.sh; do
            "$f" --help > /dev/null
            if "$f" --no-such-option < /dev/null > /dev/null 2>&1; then echo "$f accepted an unknown option"; exit 1; fi
          done
          # 6 个入口脚本与 direct 日常操作（direct/subctl 的帮助经 setup_direct.sh status --help 显示）的帮助按 OWNEXIT_LANG
          # 切换：en 不得出现中文，zh 必须是中文那份。
          for f in direct/setup_direct.sh direct/connect_to.sh direct/sync_to_vps.sh direct/doctor.sh \
                   chain/setup_chain.sh chain/multi_chain_client.sh "direct/setup_direct.sh status"; do
            OWNEXIT_LANG=en $f --help > /tmp/help.en
            OWNEXIT_LANG=zh $f --help > /tmp/help.zh
            if LC_ALL=C grep -q $'[\xe3-\xe9]\|\xef\xbc\|\xef\xbd\|\xe2\x80[\x98\x99\x9c\x9d]' /tmp/help.en; then echo "$f: English help contains Chinese"; exit 1; fi
            if ! LC_ALL=C grep -q $'[\xe3-\xe9]\|\xef\xbc\|\xef\xbd\|\xe2\x80[\x98\x99\x9c\x9d]' /tmp/help.zh; then echo "$f: Chinese help has no Chinese"; exit 1; fi
          done
          # 2.0 移除的写法必须以退出码 2 结束（并提示新写法），不能照常执行，也不能落成其它退出码。
          for cmd in "direct/setup_direct.sh --rotate-keys" "direct/setup_direct.sh --add-device phone" "direct/subctl status" \
                     "chain/setup_chain.sh rehost-exit" "chain/setup_chain.sh --id main rehost-exit"; do
            rc=0; $cmd < /dev/null > /dev/null 2>&1 || rc=$?
            [ "$rc" -eq 2 ] || { echo "$cmd: expected exit 2, got $rc"; exit 1; }
          done

  package:
    # 构建 sdist / wheel，在全新虚拟环境里安装 wheel，确认 ownexit 入口和每个子命令都能转发到包内脚本。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*
      - name: Install and run
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/venv/bin/ownexit --version
          /tmp/venv/bin/ownexit --help
          for c in direct connect chain multi doctor; do /tmp/venv/bin/ownexit "$c" --help > /dev/null; done
          # ownexit subctl 已在 2.0 移除：仍转给包内脚本，由脚本提示新写法并退出 2；带内部标记也不能绕过。
          rc=0; /tmp/venv/bin/ownexit subctl status > /dev/null 2>&1 || rc=$?; [ "$rc" -eq 2 ] || { echo "ownexit subctl: expected exit 2, got $rc"; exit 1; }
          rc=0; OWNEXIT_VIA_DIRECT=1 /tmp/venv/bin/ownexit subctl status > /dev/null 2>&1 || rc=$?; [ "$rc" -eq 2 ] || { echo "ownexit subctl with marker: expected exit 2, got $rc"; exit 1; }
          if /tmp/venv/bin/ownexit no-such-command > /dev/null 2>&1; then echo "unknown command accepted"; exit 1; fi

  bash32:
    # 链式脚本承诺能在 macOS 自带的 bash 3.2 上运行。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse with /bin/bash
        run: |
          /bin/bash --version | head -1
          for f in chain/*.sh direct/*.sh direct/subctl; do /bin/bash -n "$f"; done
      - name: Interface freeze with /bin/bash
        run: /bin/bash scripts/check_interface.sh
      - name: Bilingual docs with /bin/bash
        run: /bin/bash scripts/check_i18n.sh
      - name: Bilingual script output with /bin/bash
        run: /bin/bash scripts/check_ui_lang.sh
